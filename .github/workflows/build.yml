
name: Build Rogue 3.6 JEC

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, name: linux-x64 }
          - { os: ubuntu-24.04-arm, name: linux-arm64 }
          - { os: macos-15-intel, name: macos-intel }
          - { os: macos-15, name: macos-arm64 }

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev libcrypt-dev

      - name: Configure Linux build
        if: runner.os == 'Linux'
        run: sh ./configure --program=rogue36

      - name: Build
        run: |
          make PROGRAM=rogue36
          mkdir -p dist
          cp rogue36 dist/

      - uses: actions/upload-artifact@v6
        with:
          name: rogue36-${{ matrix.name }}
          path: dist/rogue36
          if-no-files-found: error

  windows:
    runs-on: windows-2025

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Configure Git line endings
        shell: pwsh
        run: git config --global core.autocrlf input

      - uses: actions/checkout@v6

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-pdcurses
            zip
            unzip
            diffutils

      - name: Verify static PDCurses VT library
        run: test -s /ucrt64/lib/libpdcurses_vt.a

      - name: Build
        run: |
          make PROGRAM=rogue36
          test -s rogue36.exe

      - name: Create Windows distribution ZIP
        run: |
          make dist.win
          test -s rogue36_007_windows.zip

      - name: Validate packaged ZIP, DLL dependencies and language/score behavior
        run: sh windows/check-dist-win.sh rogue36_007_windows.zip

      # upload-artifact already wraps artifacts in a ZIP when downloaded.
      # Unpack the release ZIP first so its Rogue 3.6/ directory is the
      # artifact root; the original release ZIP remains available unchanged.
      - name: Prepare single-extraction Windows artifact
        run: |
          mkdir -p dist-artifact
          unzip -q rogue36_007_windows.zip -d dist-artifact
          test -s 'dist-artifact/Rogue 3.6/rogue36.exe'

      - uses: actions/upload-artifact@v6
        with:
          name: rogue36-windows-ucrt64
          path: dist-artifact/
          if-no-files-found: error

